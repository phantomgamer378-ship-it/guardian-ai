<!DOCTYPE html>
<html>
<head>
    <title>Guardian AI - Test</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 0 auto; padding: 20px; }
        .chat-container { border: 1px solid #ddd; padding: 20px; height: 400px; overflow-y: auto; }
        .input-group { margin-top: 20px; }
        input { width: 80%; padding: 10px; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; }
        .message { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .user { background: #e3f2fd; text-align: right; }
        .bot { background: #f3e5f5; }
    </style>
</head>
<body>
    <h1>Guardian AI - Cybersecurity Assistant</h1>
    <div id="chat" class="chat-container"></div>
    <div class="input-group">
        <input type="text" id="messageInput" placeholder="Ask about cybersecurity...">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const API_URL = 'http://localhost:8000/api/v1/chat';
        let userId = 'user_' + Math.random().toString(36).substr(2, 9);
        let sessionId = 'session_' + Date.now();

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message) return;

            addMessage(message, 'user');
            input.value = '';

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: userId,
                        session_id: sessionId,
                        message: message
                    })
                });

                const data = await response.json();
                addMessage(data.response, 'bot');
            } catch (error) {
                addMessage('Sorry, I encountered an error. Please try again.', 'bot');
            }
        }

        function addMessage(text, sender) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
